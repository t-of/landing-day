<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0f22"/>
      <stop offset="0.65" stop-color="#121c3c"/>
      <stop offset="1" stop-color="#1d2a52"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.72" r="0.5">
      <stop offset="0" stop-color="#ffb84d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffb84d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wingL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffcf7a"/>
      <stop offset="1" stop-color="#ffab3d"/>
    </linearGradient>
    <linearGradient id="wingR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe3ab"/>
      <stop offset="1" stop-color="#ffc766"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#sky)"/>
  <ellipse cx="256" cy="368" rx="230" ry="120" fill="url(#glow)"/>

  <!-- motion trail (behind the plane, opposite its direction of travel) -->
  <g stroke="#eceef3" stroke-opacity="0.28" stroke-width="7" stroke-linecap="round">
    <line x1="348" y1="168" x2="372" y2="146" stroke-opacity="0.38"/>
    <line x1="382" y1="150" x2="404" y2="130" stroke-opacity="0.26"/>
    <line x1="414" y1="132" x2="434" y2="114" stroke-opacity="0.16"/>
  </g>

  <!-- paper airplane, nose down, descending toward the runway -->
  <g transform="translate(292,205) rotate(-25)">
    <path d="M0,92 L62,-58 L4,-30 Z" fill="url(#wingR)"/>
    <path d="M0,92 L-62,-58 L-4,-30 Z" fill="url(#wingL)"/>
    <path d="M0,92 L4,-30 L-4,-30 Z" fill="#8a5a1e" fill-opacity="0.35"/>
  </g>

  <!-- runway -->
  <rect x="88" y="352" width="336" height="58" rx="29" fill="#e9ecf3"/>
  <rect x="88" y="352" width="336" height="58" rx="29" fill="#0a0f22" fill-opacity="0.08"/>
  <g fill="#1d2a52">
    <rect x="140" y="374" width="26" height="10" rx="4"/>
    <rect x="188" y="374" width="26" height="10" rx="4"/>
    <rect x="236" y="374" width="26" height="10" rx="4"/>
    <rect x="284" y="374" width="26" height="10" rx="4"/>
    <rect x="332" y="374" width="26" height="10" rx="4"/>
  </g>

  <!-- exam-day marker at the far end of the runway -->
  <g>
    <rect x="398" y="332" width="6" height="78" rx="3" fill="#eceef3"/>
    <path d="M404,332 L440,344 L404,356 Z" fill="#ffb84d"/>
  </g>
</svg>
