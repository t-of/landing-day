<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f22">
  <meta name="description" content="問題と答えを打って暗記カードを作り、試験の日を決めると、毎日「今日の分」だけ出てくる。上の滑走路のメーターで、今のペースで試験の日に全部覚えて着陸できるかが一目で分かる。">
  <title>LANDING DAY — 試験の日に着陸する暗記カード</title>

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="LANDING DAY">
  <meta property="og:title" content="LANDING DAY — 試験の日に着陸する暗記カード">
  <meta property="og:description" content="問題と答えを打って暗記カードを作り、試験の日を決めると、毎日「今日の分」だけ出てくる。上の滑走路のメーターで、今のペースで試験の日に全部覚えて着陸できるかが一目で分かる。">
  <meta property="og:url" content="https://t-of.github.io/landing-day/">
  <meta property="og:image" content="https://t-of.github.io/landing-day/icons/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">

  <!-- apple-mobile-web-app-status-bar-style は付けない（black-translucent だと iOS 26 で上部が隠れる） -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LANDING DAY">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <link rel="stylesheet" href="./webapp-kit/webapp-kit.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app" id="home">
    <header class="bar">
      <h1 class="bar__title" id="examName">LANDING DAY</h1>
      <div class="bar__actions">
        <button class="pill" id="btnCards" data-t="nav.cards">カード</button>
        <button class="pill" id="btnSettings" data-t="nav.settings">設定</button>
      </div>
    </header>

    <button class="meter" id="meter" data-t-label="pro.graph" aria-describedby="meterLine"></button>
    <p class="meter__line" id="meterLine"></p>

    <section class="stage" id="stage">
      <!-- 今日の分の内訳（メーターと下のボタンのあいだ） -->
      <section class="plan" id="plan" hidden>
        <h2 class="plan__title" id="planTitle"></h2>
        <dl class="plan__stats">
          <div><dt id="planL1"></dt><dd id="planV1"></dd></div>
          <div><dt id="planL2"></dt><dd id="planV2"></dd></div>
          <div><dt data-t="plan.streak"></dt><dd id="planStreak"></dd></div>
          <div><dt data-t="plan.daysLeft"></dt><dd id="planDays"></dd></div>
        </dl>
      </section>
      <div class="landed" id="landed" hidden>
        <p class="landed__title" id="landedTitle"></p>
        <p class="landed__sub" id="landedSub"></p>
        <button class="big" id="btnNextExam" data-t="landed.next">次の試験を決める</button>
        <button class="ghost" id="btnShareLanded" data-t="kit.share">共有</button>
      </div>
      <div class="today" id="today">
        <button class="big" id="btnToday"></button>
        <button class="ghost" id="btnMore" data-t="home.more" hidden>もう少しやる</button>
      </div>
    </section>

    <footer class="credit">
      <a href="/" data-t="brand">T.OF... のアプリ</a>
      <span class="credit__kit">
        <button class="pill" data-wak="install" hidden data-t="kit.install">アプリにする</button>
        <button class="pill" data-wak="share" data-t="kit.share">共有</button>
      </span>
    </footer>
  </main>

  <!-- めくる（全画面）。隠すときは hidden（display: none） -->
  <section class="study" id="study" hidden>
    <header class="study__top">
      <button class="icon-btn" id="studyClose" data-t-label="study.close" aria-label="閉じる">×</button>
      <span class="study__count" id="studyCount"></span>
    </header>
    <div class="study__bar"><i id="studyBar"></i></div>
    <div class="study__stage">
      <div class="card" id="card" role="button" tabindex="0">
        <span class="card__inner">
          <span class="card__face card__front"><span class="card__text" id="cardQ"></span><small data-t="study.flip">タップで答え</small></span>
          <span class="card__face card__back"><small class="card__q" id="cardQ2"></small><span class="card__text" id="cardA"></span></span>
        </span>
      </div>
    </div>
    <div class="study__answers" id="answers">
      <button class="answer answer--again" id="btnAgain" data-t="study.again">まだ</button>
      <button class="answer answer--good" id="btnGood" data-t="study.good">覚えた</button>
    </div>
  </section>

  <!-- シート。<dialog> は閉じていると display: none -->
  <dialog class="sheet" id="coachSheet">
    <h2 data-t="coach.title">LANDING DAY の使い方</h2>
    <ol class="coach">
      <li data-t="coach.1"></li>
      <li data-t="coach.2"></li>
      <li data-t="coach.3"></li>
      <li data-t="coach.4"></li>
    </ol>
    <button class="big" id="coachOk" data-t="coach.ok">はじめる</button>
  </dialog>

  <dialog class="sheet" id="examSheet">
    <form id="examForm" method="dialog">
      <h2 data-t="exam.set">試験を決める</h2>
      <label class="field"><span data-t="exam.name">試験の名前</span>
        <input id="examNameIn" maxlength="40" data-t-ph="exam.namePh" autocomplete="off"></label>
      <label class="field"><span data-t="exam.date">試験の日</span>
        <input id="examDateIn" type="date" required></label>
      <fieldset class="choice" id="examReset" hidden>
        <label><input type="radio" name="reset" value="keep" checked> <span data-t="landed.keep"></span></label>
        <label><input type="radio" name="reset" value="reset"> <span data-t="landed.reset"></span></label>
      </fieldset>
      <div class="row">
        <button type="button" class="ghost" data-close data-t="ui.close">閉じる</button>
        <button class="big big--inline" data-t="exam.save">決める</button>
      </div>
    </form>
  </dialog>

  <dialog class="sheet sheet--tall" id="cardsSheet">
    <header class="sheet__head">
      <h2 data-t="nav.cards">カード</h2>
      <span class="sheet__count" id="cardsCount"></span>
      <button class="icon-btn" data-close data-t-label="ui.close" aria-label="閉じる">×</button>
    </header>
    <form class="add" id="addForm">
      <label class="field"><span data-t="cards.q">問題</span><textarea id="addQ" rows="2" maxlength="500" required></textarea></label>
      <label class="field"><span data-t="cards.a">答え</span><textarea id="addA" rows="2" maxlength="500" required></textarea></label>
      <div class="row">
        <button type="button" class="chip" data-lock="images"><svg class="lock"><use href="#i-lock"/></svg><span data-t="pro.images"></span></button>
        <button class="big big--inline" id="addBtn" data-t="cards.add">足す</button>
      </div>
    </form>
    <details class="paste" id="paste">
      <summary data-t="cards.paste">まとめて貼り付け</summary>
      <p class="help" data-t="cards.pasteHelp"></p>
      <textarea id="pasteIn" rows="5"></textarea>
      <p class="help" id="pasteNote"></p>
      <button class="big big--inline" id="pasteBtn" disabled></button>
    </details>
    <button type="button" class="chip" data-lock="csv"><svg class="lock"><use href="#i-lock"/></svg><span data-t="pro.csv"></span><em data-t="lock.soon"></em></button>
    <p class="help" id="cardsEmpty" data-t="cards.empty" hidden></p>
    <ul class="list" id="cardList"></ul>
  </dialog>

  <dialog class="sheet" id="editSheet">
    <form id="editForm" method="dialog">
      <h2 data-t="cards.edit">直す</h2>
      <label class="field"><span data-t="cards.q">問題</span><textarea id="editQ" rows="3" maxlength="500" required></textarea></label>
      <label class="field"><span data-t="cards.a">答え</span><textarea id="editA" rows="3" maxlength="500" required></textarea></label>
      <div class="row">
        <button type="button" class="ghost" id="editDelete" data-t="cards.delete">消す</button>
        <button class="big big--inline" data-t="cards.edit">直す</button>
      </div>
    </form>
  </dialog>

  <dialog class="sheet" id="settingsSheet">
    <header class="sheet__head">
      <h2 data-t="nav.settings">設定</h2>
      <button class="icon-btn" data-close data-t-label="ui.close" aria-label="閉じる">×</button>
    </header>
    <button class="line" id="soundBtn"><span data-t="set.sound">音</span><b id="soundState"></b></button>
    <button class="line" id="editExamBtn"><span data-t="exam.edit">試験を直す</span><b>›</b></button>
    <h3 data-t="set.pro">有料の機能</h3>
    <ul class="pro" id="proList"></ul>
    <p class="credit"><a href="/" data-t="brand">T.OF... のアプリ</a></p>
  </dialog>

  <dialog class="sheet" id="lockSheet">
    <h2><svg class="lock lock--big"><use href="#i-lock"/></svg> <span data-t="lock.title">有料の機能は近日</span></h2>
    <p id="lockBody"></p>
    <button class="big" data-close data-t="ui.close">閉じる</button>
  </dialog>

  <dialog class="sheet" id="doneSheet">
    <h2 data-t="done.title">今日の分おわり</h2>
    <p class="done__stats" id="doneStats"></p>
    <div class="done__meter" id="doneMeter"></div>
    <p class="done__pace" id="donePace"></p>
    <p class="done__streak" id="doneStreak"></p>
    <div class="done__btns">
      <button class="big" id="doneMore" data-t="home.more">もう少しやる</button>
      <button type="button" class="chip" data-lock="weak"><svg class="lock"><use href="#i-lock"/></svg><span data-t="pro.weak"></span><em data-t="lock.soon"></em></button>
      <div class="row">
        <button class="ghost" id="doneShare" data-t="kit.share">共有</button>
        <button class="ghost" data-close data-t="done.home">ホームへ</button>
      </div>
    </div>
  </dialog>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-lock" viewBox="0 0 16 16"><path fill="currentColor" d="M4 7V5a4 4 0 0 1 8 0v2h.5A1.5 1.5 0 0 1 14 8.5v5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 13.5v-5A1.5 1.5 0 0 1 3.5 7H4zm2 0h4V5a2 2 0 0 0-4 0v2z"/></symbol>
  </svg>

  <script src="./webapp-kit/webapp-kit.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
